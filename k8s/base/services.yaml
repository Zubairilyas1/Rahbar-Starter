# Four ClusterIP services. chroma and redis are never NodePort/LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rahbar
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: rahbar
spec:
  selector: {app: ui}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: rahbar
spec:
  clusterIP: None   # headless: governs the chroma StatefulSet
  selector: {app: chroma}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rahbar
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
