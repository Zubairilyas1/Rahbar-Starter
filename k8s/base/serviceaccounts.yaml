# One ServiceAccount per workload (section 4.7). None of these pods ever call the
# Kubernetes API server, so the token is never auto-mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-api
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-ui
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-chroma
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-redis
  namespace: rahbar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-indexer
  namespace: rahbar
automountServiceAccountToken: false
