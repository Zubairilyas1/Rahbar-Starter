# Documents the Secret's shape only. NEVER list this in kustomization.yaml --
# applying it would overwrite the real Secret. Create the real one with:
#
#   kubectl create secret generic rahbar-secret -n rahbar \
#     --from-literal=LLM_API_KEY="$LLM_API_KEY"
#
# (the shipped LLM_PROVIDER=ollama-host needs no key; this exists so the hosted
# provider and the Secret-handling rubric line both have something to point at)
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
