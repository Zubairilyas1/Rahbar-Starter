# A tiny shell pod with every RAGOps volume mounted (Assignment 03 A/F). It never
# touches Chroma (no network policy lets it); it is how you look at or move files:
#
#   kubectl exec -n rahbar deploy/ragops-toolbox -- ls -R /datalake
#   kubectl cp ./new-batch/. rahbar/<toolbox-pod>:/datalake/incoming/     # demo: unseen batch
#   kubectl cp rahbar/<toolbox-pod>:/results ./eval/results/cluster        # commit results
#   kubectl cp rahbar/<toolbox-pod>:/traces  ./traces/cluster              # commit traces
#
# (Get the pod name with: kubectl get pod -n rahbar -l app=ragops-toolbox -o name)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragops-toolbox
  namespace: rahbar
spec:
  replicas: 1
  selector:
    matchLabels: {app: ragops-toolbox}
  template:
    metadata:
      labels: {app: ragops-toolbox}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: toolbox
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /datalake/incoming && sleep 2147483647"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: datalake, mountPath: /datalake}
            - {name: results, mountPath: /results}
            - {name: traces, mountPath: /traces}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
      volumes:
        - name: datalake
          persistentVolumeClaim: {claimName: rahbar-datalake}
        - name: results
          persistentVolumeClaim: {claimName: rahbar-results}
        - name: traces
          persistentVolumeClaim: {claimName: rahbar-traces}
