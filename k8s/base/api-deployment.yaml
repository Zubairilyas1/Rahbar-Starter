# The live API (Assignment 03 F1/F3). Releases are pod-template changes, rolled out
# with maxUnavailable: 0 and watched with `kubectl rollout status`; the release
# provenance env below is what a trace records, so after `kubectl rollout undo`
# the next trace shows the previous collection and embedding version.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rahbar
  annotations:
    kubernetes.io/change-cause: "baseline: collection rahbar (chunk 400 / overlap 50), nomic-embed-text v1.5"
spec:
  revisionHistoryLimit: 10
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      serviceAccountName: rahbar-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: rahbar-api:dev   # overlays pin this to a real tag/SHA
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: rahbar-config}}]
          env:
            - name: LLM_API_KEY
              valueFrom: {secretKeyRef: {name: rahbar-secret, key: LLM_API_KEY}}
            # --- release provenance (changed by a release, reversed by rollout undo) ---
            - {name: PIPELINE_VERSION, value: "baseline"}
            - {name: CHROMA_COLLECTION, value: "rahbar"}
            - {name: COLLECTION_VERSION, value: "c400-o50"}
            - {name: EMBED_MODEL, value: "nomic-embed-text"}
            - {name: EMBED_VERSION, value: "v1.5"}
            # --- traces: stdout (kubectl logs) AND one file per pod on the traces PVC ---
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: TRACE_LOG_PATH, value: "/traces/$(POD_NAME).jsonl"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: traces, mountPath: /traces}
          lifecycle:
            preStop: {exec: {command: ["sh", "-c", "sleep 5"]}}
          # F5: measured with `kubectl top pods --containers` (idle ~13m CPU / ~69Mi;
          # under the eval Job see docs/evidence/a3/kubectl-top-under-eval.txt).
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # section 4.3: exact probe timings from the handout.
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: traces
          persistentVolumeClaim: {claimName: rahbar-traces}
