apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# secret.placeholder.yaml is deliberately NOT listed here -- applying it would
# overwrite the real Secret created with `kubectl create secret`.
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - chroma-statefulset.yaml
  - redis-deployment.yaml
  - services.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - indexer-job.yaml
  - ui-deployment.yaml
  - api-deployment.yaml
  - hpa.yaml
  - reindex-cronjob.yaml
