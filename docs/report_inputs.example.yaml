# Copy to docs/report_inputs.yaml to pin which result file feeds each report table.
# Every key is optional; without it scripts/build_report.py picks the newest match.
# Paths are relative to the repository root.
#
# part_b:        eval/results/cluster/eval_baseline_<ts>.json   # Part B, before Batch B
# after_batch_b: eval/results/cluster/eval_baseline_<ts>.json   # E3, after Batch B
# cand_good:     eval/results/cluster/eval_candidate_<ts>.json  # rahbar_c600
# cand_bad:      eval/results/cluster/eval_candidate_<ts>.json  # rahbar_c120
# gate_pass:     eval/results/cluster/gate_candidate_<ts>.json
# gate_fail:     eval/results/cluster/gate_candidate_<ts>.json
# verif_b:       eval/results/cluster/verification_report_<ts>.json
# cov_before:    eval/results/coverage_golden_baseline_<ts>.json
# cov_after:     eval/results/coverage_golden_<ts>.json
#
# D5: one wrong or abstained Part B answer, root-caused from its trace only
# (python traces/diagnose.py eval-r1-ask-<question id> --path traces/cluster).
# d5_trace_id: eval-r1-ask-g12
# d5_lines:
#   - "1. ..."
#   - "2. ..."
#   - "3. ..."
#   - "4. ..."
#   - "5. ..."
